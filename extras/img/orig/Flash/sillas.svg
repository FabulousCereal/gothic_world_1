       id="flowPara1666">Seriously? I can't edit symbols? You mean the SVG output of another program is read-only? Fuck inkscape</flowPara></flowRoot>
  <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:24px;line-height:1.25;font-family:monospace;-inkscape-font-specification:monospace;letter-spacing:0px;word-spacing:0px;white-space:pre;inline-size:386.529;display:inline;fill:#ff0000;fill-opacity:1"
     x="-10.184772"
     y="445.7648"
     id="text1658"
     transform="translate(-2.6694584,-197.76715)"><tspan
       x="-10.184772"
       y="445.7648"
       id="tspan2910">No, really, inkscape sucks </tspan><tspan
       x="-10.184772"
       y="475.7648"
       id="tspan2912">at every step on the </tspan><tspan
       x="-10.184772"
       y="505.7648"
       id="tspan2914">journey to doing anything. </tspan><tspan
       x="-10.184772"
       y="535.76477"
       id="tspan2916">Like, why can't I enter </tspan><tspan
       x="-10.184772"
       y="565.76477"
       id="tspan2918">newlines without having to </tspan><tspan
       x="-10.184772"
       y="595.76477"
       id="tspan2920">type some text first and </tspan><tspan
       x="-10.184772"
       y="625.76477"
       id="tspan2922">then go back and add </tspan><tspan
       x="-10.184772"
       y="655.76477"
       id="tspan2924">them????? why the hell </tspan><tspan
       x="-10.184772"
       y="685.76477"
       id="tspan2926">can't i change the current </tspan><tspan
       x="-10.184772"
       y="715.76477"
       id="tspan2928">stroke color without </tspan><tspan
       x="-10.184772"
       y="745.76477"
       id="tspan2930">drawing a line first, like </tspan><tspan
       x="-10.184772"
       y="775.76477"
       id="tspan2932">any other normal program?? </tspan><tspan
       x="-10.184772"
       y="805.76477"
       id="tspan2934">sure, i guess i could edit </tspan><tspan
       x="-10.184772"
       y="835.76477"
       id="tspan2936">the raw XML to get around </tspan><tspan
       x="-10.184772"
       y="865.76477"
       id="tspan2938">the read-only symbols </tspan><tspan
       x="-10.184772"
       y="895.76477"
       id="tspan2940">problem, just gotta deal </tspan><tspan
       x="-10.184772"
       y="925.76477"
       id="tspan2942">with XML instead, what a </tspan><tspan
       x="-10.184772"
       y="955.76477"
       id="tspan2944">joy. i'm done, I'M SO DONE</tspan></text>
